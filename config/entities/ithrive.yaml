# config/entities/ithrive.yaml
#
# The entity registry entry for iThrive Medical. Adding an LLC is a new file
# here plus its config/<entity>/ directory — never a code change
# (docs/multi-entity.md).

entity_id: ithrive
legal_name: iThrive Medical LLC
status: active
timezone: America/New_York

agents:
  - name: shannon
    kind: shannon_replenishment
    schedule: "cron: 0 6 * * MON"
  - name: shannon
    kind: shannon_ops_reminder
    schedule: "every: 6 weeks"

# `key` is the short name used in listings.yaml and in BOM `channels:`
# filters. Channels are data: a new channel is a line here.
#
# `amazon_fbm` is the fulfilment channel — Amazon merchant-fulfilled. It is
# not the Veeqo SKU that happens to be spelled FBM; that collision is why
# the channel side carries the `amazon_` prefix everywhere now.
#
# `veeqo_channel` is the name Veeqo prints on an order, spelled exactly as
# Veeqo spells it. Live velocity is split by channel on that string, and a
# channel Veeqo reports which is not named here stops the run instead of
# being guessed at — guessing FBA versus merchant sends stock to Amazon.
# The real strings come off the first live read (parking lot PL-11).
channels:
  - name: amazon_fba
    key: amazon_fba
    fulfillment: fba
    has_history: true
    veeqo_channel: TBD-VEEQO-CHANNEL-AMAZON-FBA
  - name: amazon_fbm
    key: amazon_fbm
    fulfillment: merchant
    has_history: true
    veeqo_channel: TBD-VEEQO-CHANNEL-AMAZON-FBM
  - name: shopify
    key: shopify
    fulfillment: merchant
    has_history: true
    veeqo_channel: TBD-VEEQO-CHANNEL-SHOPIFY
  - name: walmart_sf
    key: walmart_sf
    fulfillment: merchant
    has_history: false      # approved, zero history — silent until it has sales
    veeqo_channel: TBD-VEEQO-CHANNEL-WALMART-SF
  - name: walmart_wfs
    key: walmart_wfs
    fulfillment: wfs
    has_history: false
    veeqo_channel: TBD-VEEQO-CHANNEL-WALMART-WFS

suppliers_config: config/ithrive/suppliers.yaml
boms_config: config/ithrive/boms.yaml
shannon_config: config/ithrive/shannon.yaml
policy_config: config/ithrive/policy.yaml
# Amazon's own SKUs and each listing's status. Data only: Amazon identity
# cannot be derived from an internal SKU, and a listing's status is what
# tells "nobody wants this" from "he could not sell it".
listings_config: config/ithrive/listings.yaml

# Notification addresses live in shannon_config, mapped from role names.
credentials_prefix: ITHRIVE_
books: quickbooks_online
