# config/entities/ithrive.yaml
#
# The entity registry entry for iThrive Medical. Adding an LLC is a new file
# here plus its config/<entity>/ directory — never a code change
# (docs/multi-entity.md).

entity_id: ithrive
legal_name: iThrive Medical LLC
status: active
timezone: America/New_York

agents:
  - name: shannon
    kind: shannon_replenishment
    schedule: "cron: 0 6 * * MON"
  - name: shannon
    kind: shannon_ops_reminder
    schedule: "every: 6 weeks"

# `key` is the short name used in listings.yaml and in BOM `channels:`
# filters. Channels are data: a new channel is a line here.
#
# `amazon_fbm` is the fulfilment channel — Amazon merchant-fulfilled. It is
# not the Veeqo SKU that happens to be spelled FBM; that collision is why
# the channel side carries the `amazon_` prefix everywhere now.
#
# `veeqo_channel` is the name Veeqo prints on an order, spelled exactly as
# Veeqo spells it. Live velocity is split by channel on that string, and a
# channel Veeqo reports which is not named here stops the run instead of
# being guessed at — guessing FBA versus merchant sends stock to Amazon.
# Zach read the four connected names off the account on 24 Aug 2026.
#
# `not_connected` is not a name: it says the channel exists in the business
# and not in Veeqo. It is deliberately different from a TBD placeholder,
# which says nobody has looked yet and stops a live run. Veeqo cannot
# report an order on a channel it does not have, so nothing goes uncounted;
# the day one appears, its name is unknown and the run stops (PL-11).
channels:
  - name: amazon_fba
    key: amazon_fba
    fulfillment: fba
    has_history: true
    veeqo_channel: "Amazon FBA"
  - name: amazon_fbm
    key: amazon_fbm
    fulfillment: merchant
    has_history: true
    # Veeqo spells merchant-fulfilled Amazon simply "Amazon". Matching is
    # exact, so this never swallows "Amazon FBA" above.
    veeqo_channel: "Amazon"
  - name: shopify
    key: shopify
    fulfillment: merchant
    has_history: true
    veeqo_channel: "Shopify"
  - name: walmart_sf
    key: walmart_sf
    fulfillment: merchant
    has_history: false      # approved, zero history — silent until it has sales
    # Zach's account names this channel after the seller, not the
    # programme. Seller-fulfilled is what Justin ships by hand, and WFS is
    # separate and not connected at all — but the string itself does not
    # prove which one it is, and nobody has read it off the account with a
    # credential (PL-12).
    veeqo_channel: "ithrive"
  - name: walmart_wfs
    key: walmart_wfs
    fulfillment: wfs
    has_history: false
    veeqo_channel: not_connected   # no such channel in Veeqo yet

# Channels Veeqo does report and Shannon deliberately does not count.
# Reorder demand is US only by Zach's decision (24 Aug 2026): Canada and
# Mexico FBA/FBM sales do not create demand here. The list is empty because
# nobody has read those channels' exact Veeqo names off the account. Until
# they are here, an order on one of them is an unnamed channel and stops the
# run — loudly wrong rather than quietly counted (PL-12).
excluded_veeqo_channels: []

suppliers_config: config/ithrive/suppliers.yaml
boms_config: config/ithrive/boms.yaml
shannon_config: config/ithrive/shannon.yaml
policy_config: config/ithrive/policy.yaml
# Amazon's own SKUs and each listing's status. Data only: Amazon identity
# cannot be derived from an internal SKU, and a listing's status is what
# tells "nobody wants this" from "he could not sell it".
listings_config: config/ithrive/listings.yaml

# Notification addresses live in shannon_config, mapped from role names.
credentials_prefix: ITHRIVE_
books: quickbooks_online
