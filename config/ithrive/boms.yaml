# config/ithrive/boms.yaml
#
# Bill of materials for the seven HMZ kits assembled in-house by iThrive Medical.
# Source of truth for BOM explosion. Veeqo cannot hold this (no FBA bundle support),
# so it lives here, version-controlled, and Veeqo FBM bundles are a cross-check only.
#
# Drafted 20 Aug 2026 from Zach's completed BOM worksheet.
# Lines marked CONFIRM are unverified and must be resolved before first live run.
#
# Identity of every component is (supplier, part). Never a bare part number.

bom_version: 2026-08-20

# ---------------------------------------------------------------------------
# SUPPLIERS — capability decides how a line can be acquired, never hardcoded
# ---------------------------------------------------------------------------
suppliers:
  nar:
    name: North American Rescue
    acquisition: browser            # narescue.com, no API (confirmed with vendor)
    lead_time_weeks: 3
    credentials_env_prefix: NAR_
    notes: >
      Order-status field on the site is unreliable and must not be read; outstanding
      orders are resolved from Gmail (confirmation without shipping notification).
      Some products are configurable and cannot be added via Order by SKU.

  dynarex:
    name: Dynarex Corporation
    acquisition: browser            # dynarex.com, account login
    lead_time_weeks: TODO           # ask Zach
    credentials_env_prefix: DYNAREX_
    notes: >
      Zach has a dynarex.com account. Credentials come from environment variables —
      Chrome's saved passwords are not reachable from the automation container.

  amazon_business:
    name: Amazon Business
    acquisition: cart_url           # cart built from ASINs
    lead_time_weeks: 1
    notes: Pack size is read from the live listing at cart time; see pack_size_policy.

  world_richman:
    name: World Richman Corporation
    acquisition: purchase_order     # rep: Scott Mareci
    lead_time_weeks: TODO           # ask Zach
    part_number_format: "<kit_sku>-bag"
    notes: >
      All soft goods — carrying cases, nylon bags, MOLLE pouches, belt carriers.
      MOQ is high; see parking_lot for the Multicam/Coyote pouch sourcing gap.

  own_printed:
    name: Own printed inserts
    acquisition: purchase_order
    lead_time_weeks: TODO

  internal:
    name: Held loose, no current reorder path
    acquisition: none
    notes: >
      Real stock on hand with no supplier attached yet. Reports and prompts;
      never enters a cart. Distinct from `pending` (unresolved, must be fixed)
      and from `unsourced` (deliberately open, buy from cheapest at the time).

  unsourced:
    name: Deliberately unsourced — prompt Zach to buy from cheapest supplier
    acquisition: none
    notes: >
      A valid permanent state, not an error. Reports on the gap list when low,
      never fails the run, never picks a supplier on Zach's behalf.

# ---------------------------------------------------------------------------
# PACK SIZE POLICY
# ---------------------------------------------------------------------------
# Demand math runs in SELLABLE units (what goes into a kit).
# Ordering runs in PURCHASE units (what the supplier sells).
#   order_units    = moq_round(net_requirement)
#   purchase_units = ceil(order_units / units_per_purchase_unit)
#   actual_units   = purchase_units * units_per_purchase_unit
# purchase_units is what goes in a cart. NEVER order_units.
#
# Per Zach: Shannon READS the pack size off each live listing rather than being
# told it up front. First time she sees a component, she reports the pack size
# and asks him to confirm it. Thereafter a mismatch between the live listing and
# the confirmed value STOPS that line and raises it — sellers change pack sizes
# on the same ASIN and that silently multiplies an order by an integer.
pack_size_policy:
  mode: discover_and_confirm
  on_mismatch: halt_line_and_flag

# ---------------------------------------------------------------------------
# COMPONENTS
