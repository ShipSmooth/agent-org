      exact, so "Amazon" never absorbs "Amazon FBA". What each string means is
      still unverified against the account — that is PL-12.
    blocks: >
      Nothing. The four names unblock the first live Veeqo run.

  - id: PL-12
    item: "'ithrive' is Walmart Seller Fulfilled on Zach's word, not on the account's"
    detail: >
      The string names the seller, not the programme, so nothing in it distinguishes
      seller-fulfilled from WFS; the two are told apart in Veeqo by the channel's
      type and its warehouse, which needs a credential to read. Configured as given.
      The other half of this item is closed: the four Amazon Canada and Mexico
      channel names were read off the account on 24 Aug 2026 and are now listed in
      excluded_veeqo_channels, so US-only demand is a decision on record rather than
      a run that stops on the first Canadian order.
    blocks: >
      Nothing, and it fails in the safe direction. If "ithrive" is really WFS,
      Walmart demand lands on the wrong one of two channels that both have zero
      history, which changes no number now. Confirm the channel's type and warehouse
      at the first live run.

  # PL-8 RESOLVED — see the note on PL-4 above
