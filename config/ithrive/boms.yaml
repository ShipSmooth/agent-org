  # has to deal with; a settled question sitting in it is noise.
  - id: PL-4
    resolved: true
    item: "Instruction-card mapping"
    detail: >
      RESOLVED 21 Aug 2026. Four distinct cards, not three:
      CARD-ESSENTIAL-EXPRESS (Next Day Flyers) — 20-314, 20-315, 25-001, 25-002;
      CARD-REDBAG (48HourPrint) — 26-001;
      CARD-BASIC-CAT (Next Day Flyers) — 25-010;
      CARD-BASIC-SAMXT (Next Day Flyers) — 26-002.
      Three of the four come from Next Day Flyers, one from 48HourPrint; both
      quote ~10 business days.

  - id: PL-9
    item: "NAR terms for the blue TRAINING C-A-T 30-0033 — 400 minimum / 200 step?"
    detail: >
      30-0033 carries moq_min 400 and moq_increment 200 because that is NAR's rule
      for the live C-A-T colourways, and it is what the 24 Aug BOM says. Nothing on
      record states the terms for the TRAINING unit specifically: it is a different
      product at a different price, and training stock is often sold in smaller
      quantities. Shannon has applied 400/200 as written rather than guessing at
      something kinder — but it is assumed, not confirmed.
    blocks: >
      Nothing today. If NAR's real minimum is lower, the first 30-0033 order will be
      larger than it needed to be — the error is in the safe direction, but it is
      real money. Ask NAR, then correct moq_min / moq_increment here.

  - id: PL-10
    item: "Four hand counts carry a date they were restated on, not a date they were counted on"
    detail: >
      The 26 Aug worksheet dated seven of the eleven hand counts explicitly
      ("400 counted by Zach 2026-08-26"). Four did not: the Black and Green MOLLE
      pouches came over as approximations ("~2,000", "~4,750") and the two Orca
      pouches as "ZERO — kit cannot be built". A manual count needs a date, so all
      four carry counted_on: 2026-08-26 — the day the worksheet restated them. If
      those numbers are older than that, their age on the report is optimistic, and
      the two approximate ones are approximate.
    blocks: >
      Nothing. Confirm the four counts and their real dates at the next stock take,
      then correct manual_stock here. Shannon will ask again automatically once any
      count passes eight weeks.

  # PL-11 RESOLVED for the four connected channels — see PL-12
  - id: PL-11
    resolved: true
    item: "The names Veeqo prints on each sales channel"
    detail: >
      RESOLVED 24 Aug 2026. Zach read the names off the account: "Amazon FBA" for
      FBA, "Amazon" for merchant-fulfilled Amazon, "Shopify" for Shopify direct,
      and "ithrive" for Walmart Seller Fulfilled. Walmart WFS has no Veeqo channel
