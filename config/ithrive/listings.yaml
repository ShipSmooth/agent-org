# they are written out as `status:` below, unchanged in meaning, because Shannon must
# read a listing's status to tell "nobody wants this" from "he could not sell it", and
# she does not read comments. A channel entry is either a plain SKU (active), a
# {sku, status} block, or null for "no listing on this channel".

