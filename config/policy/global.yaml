# config/policy/global.yaml — the rulebook (docs/policy.md).
#
# Policy is data, not code. Changing a threshold is a config change.
# Anything matching no rule resolves to `default_tier` — default deny.

version: 1
default_tier: 3

thresholds:
  tier3_escalation:
    absolute_total_usd: 75000
    total_vs_trailing_avg_pct: 150
    line_qty_vs_trailing_avg_x: 2.0
    total_units_vs_trailing_avg_x: 2.0
    trailing_window_orders: 8
    min_history_orders: 4
  approval_ttl:
    tier2_hours: 72
    tier3_days: 7
  sms_approval_max_tier: 2

# max_tier_this_phase: the ceiling the ActionBroker enforces regardless of
# any rule below. It is still 0 in Phase 2: the machinery for Tiers 1-3 is
# real and tested, but a proposal above Tier 0 is refused. Nothing is
# staged, nothing is bought, and no supplier hears from Shannon. Raising
# this is a deliberate act, and it has not been taken.
max_tier_this_phase: 0

# phase_exceptions: one action, by name, allowed above that ceiling and no
# further than the tier written beside it. It exists so that switching on
# live cart staging for one supplier does not also switch on sending SMS,
# updating Shopify or creating an FBA inbound plan, which is what raising
# `max_tier_this_phase` to 2 would do.
#
# To let Shannon put lines in the real narescue.com cart — and only that —
# uncomment these two lines:
#
#   - action: nar.stage_cart
#     up_to_tier: 2
#
# `up_to_tier: 2` leaves the anomaly escalations in force: a week that
# escalates to Tier 3 (a line more than twice its trailing average, or too
# little history to call anything normal) is still refused, which is the
# intended answer for a first live run. `up_to_tier: 3` accepts those too,
# and is the deliberate way to say "stage this week's cart anyway".
#
# Neither value can buy anything. No supplier holds the `purchase`
# capability, the cart interface has no checkout method, and the client
# refuses checkout, order and payment paths outright.
phase_exceptions: []

rules:
  # ---- Tier 0: silent reads and internal work ----
  - action: veeqo.read_inventory
    tier: 0
  - action: veeqo.read_orders
    tier: 0
  - action: veeqo.read_fba_inbound
    tier: 0
  - action: gmail.read_order_signals
    tier: 0
  - action: nar.read_order_history
    tier: 0
  - action: shopify.read_products
    tier: 0
  - action: internal.write_draft_report
    tier: 0
  - action: internal.write_ops_reminder_report
    tier: 0
  # Emailing the report Shannon just wrote, to the business's own operator,
  # at the address in that entity's own config. Tier 0 and not Tier 2
  # because Tier 2 is "reaches an outside person": Zach is the operator
  # this system reports to, not a third party, and the mail contains only
  # what he would read on the dashboard anyway. It is deliberately not
  # `notify.email`, which stays at Tier 2 and covers everything else,
  # because a rule that can address anybody is a different risk from a
  # rule that can only hand this week's report back to its owner. The
  # executor takes the recipients from configured roles and the body from
  # the report row; it cannot be pointed at a supplier.
  - action: internal.email_report_to_owner
    tier: 0
  # The rehearsal for staging a cart: read the supplier's cart, work out
  # exactly which SKUs and quantities would be added, write that down.
  # Tier 0 because nothing outside this machine changes — the supplier is
  # read, never written — which is what makes the plan provable while the
  # phase ceiling is still 0. The staging itself is `nar.stage_cart`,
  # below, and is a different action with a different tier. The supplier
  # must still hold `stage_cart` for this to be allowed at all: rehearsing
  # a cart Zach has not authorised is not a read he asked for.
  - action: nar.plan_cart_staging
    tier: 0

  # ---- Tier 1: internal state, notify after ----
  - action: internal.enqueue_task
    tier: 1
  - action: internal.record_gap_list
    tier: 1
  - action: internal.update_forecast_params
    tier: 1
  - action: amazon_business.stage_cart
    tier: 1

  # ---- Tier 2: reaches outside the company / any purchase action ----
  - action: nar.stage_cart
    tier: 2
  - action: dynarex.stage_cart
    tier: 2
  - action: notify.email
    tier: 2
  - action: notify.sms
    tier: 2
  - action: fba.create_inbound_plan
    tier: 2
  - action: shopify.update_product
    tier: 2

  # ---- Tier 3: categorical ----
  - action: nar.purchase
    tier: 3
  - action: shopify.bulk_price_update
    tier: 3
  - action: credentials.rotate
    tier: 3

# An action that cannot be undone is Tier 3, and that default stands for
# everything not named here. This list is the exception, one action at a
# time, in data rather than in code: an email cannot be recalled, and
# emailing this week's report to the address that asked for it is accepted
# at its own tier all the same. Adding a line here is a visible change to
# the rulebook, which is the point.
accepted_irreversible_actions:
  - internal.email_report_to_owner

escalations:
  - match: {category: purchase}
    to_tier: 3
    when_any:
      - total_usd_gt: ${thresholds.tier3_escalation.absolute_total_usd}
      - total_vs_trailing_avg_pct_gt: ${thresholds.tier3_escalation.total_vs_trailing_avg_pct}
      - line_qty_vs_trailing_avg_x_gt: ${thresholds.tier3_escalation.line_qty_vs_trailing_avg_x}
      - total_units_vs_trailing_avg_x_gt: ${thresholds.tier3_escalation.total_units_vs_trailing_avg_x}
  - match: {reversible: false}
    to_tier: 3
