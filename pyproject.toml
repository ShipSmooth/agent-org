[project]
name = "agent-org"
version = "0.0.1"
description = "The Org: tiered-autonomy business operations agents. Phase 0: architecture spec and skeleton."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly; bumped deliberately, never floated.
    "pydantic==2.11.7",        # typed models for proposals, config
    "psycopg[binary]==3.2.9",  # Postgres driver
    "httpx==0.28.1",           # Veeqo / Shopify HTTP clients
    "pyyaml==6.0.2",           # config, BOMs, policy files
    "playwright==1.54.0",      # narescue.com browser automation
    "python-dotenv==1.1.1",    # .env loading in development
]

[dependency-groups]
dev = [
    "ruff==0.12.10",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "types-pyyaml==6.0.12.20250809",
    "import-linter==2.3",
]

[project.scripts]
shannon = "agent_org.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_org"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/agent_org"]

# Enforced from Phase 1 (there is no code yet):
# 85% coverage on broker, policy, tenancy, audit, shannon (the replenishment
# calculator); 60% elsewhere.

[tool.importlinter]
root_package = "agent_org"

[[tool.importlinter.contracts]]
name = "Agents may not import integration clients directly (ActionBroker is the only path)"
type = "forbidden"
source_modules = ["agent_org.agents", "agent_org.shannon"]
forbidden_modules = ["agent_org.broker.executors"]
