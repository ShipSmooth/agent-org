# Golden fixture listings — channel identity for the worked example.
#
# The join between a component and its sales is Zach's own channel SKU, and
# only that. Until this file existed the golden run reached the C-A-T's
# sales through its ASIN, which is exactly the join the C-A-T colour
# problem proves wrong: North American Rescue owns those ASINs, three
# colourways share them, and no title states a colour.
#
# 30-0001 is listed twice, on the two merchant channels, which is the case
# that proves a component's velocity is the sum across all of its channel
# SKUs rather than whichever listing is read first. 300 + 240 = 540, the
# figure docs/replenishment.md §10 step 2 works through. Both listings are
# merchant-fulfilled because the worked example sends no loose C-A-Ts to
# Amazon: §8's allocation is of finished kits.

