# config/ithrive/suppliers.yaml
#
# Supplier capabilities for iThrive Medical (docs/supplier-model.md).
# Capability is the hard ceiling on what Shannon may even propose for a
# supplier's lines; the ActionBroker re-checks it independently of the
# calculator. Grant a capability here, never in code.
#
# Vocabulary: read_catalog | read_order_history | stage_cart | purchase |
#             report_only | pending
#
# No supplier has `purchase` in v1, and Phase 1 exercises none of these
# capabilities at all — every client is read-only.
#
# The descriptive half of each supplier (acquisition path, credential
# prefix, notes) lives in config/ithrive/boms.yaml; the two files must name
# the same supplier set, which `shannon validate-config` checks.

suppliers:
  nar:
    capabilities: [read_catalog, read_order_history, stage_cart]
    lead_time_weeks: 3
  dynarex:
    capabilities: [read_catalog, stage_cart]
    lead_time_weeks: null        # PL-7 — Zach to provide
  amazon_business:
    capabilities: [stage_cart]
    lead_time_weeks: 1
  world_richman:
    capabilities: [report_only]
    lead_time_weeks: null        # PL-7 — Zach to provide
  own_printed:
    capabilities: [report_only]
    lead_time_weeks: null
  internal:
    capabilities: [report_only]
    lead_time_weeks: null
  unsourced:
    capabilities: [report_only]
    lead_time_weeks: null
